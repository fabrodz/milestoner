name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node on Linux, plus the ends of the range on the other two: the
        # platform-specific code (the cmd.exe shim, taskkill, the report opener) is what the
        # extra runners are there to exercise, and it does not vary by Node version.
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 20 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  manifests:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema-level checks that need no external CLI, so this step is the manifest gate on
      # every runner: it fails the build on a manifest that does not parse, is missing a
      # required field, or whose version disagrees with package.json.
      - run: npm run check:manifests
      # The Claude CLI is not installed on GitHub-hosted runners and we do not install it
      # here (it is a heavy dependency to gate CI on). Run the strict validator only when a
      # runner already has it; its absence is deliberately not a failure, because the schema
      # check above already covers what a bad manifest would break.
      - name: claude plugin validate (only when the CLI is present)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
            claude plugin validate .claude-plugin/plugin.json --strict
          else
            echo "claude CLI not present on this runner; the schema check above is the gate. Skipping strict validation."
          fi
