name: Publish

# Publishes to npm when a version tag (v1.2.3) is pushed. Milestone tags (v05-debt-M06)
# carry no dots, so the pattern never matches them. Authentication is npm trusted
# publishing over OIDC - no token secret; the trusted publisher for this repository and
# workflow file must be configured once in the package's settings on npmjs.com.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the floor for trusted publishing.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refuse a tag that disagrees with package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # prepublishOnly runs the typecheck, the tests and the build before anything is sent.
      - run: npm publish
